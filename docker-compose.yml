services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: powermesh
      POSTGRES_PASSWORD: powermesh
      POSTGRES_USER: powermesh
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U powermesh -d powermesh"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - powermesh-postgres:/var/lib/postgresql/data

volumes:
  powermesh-postgres:
