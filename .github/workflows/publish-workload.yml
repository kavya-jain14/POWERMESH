name: Publish demo workload image

on:
  workflow_dispatch:
  push:
    branches: [integration/gargi-ui]
    paths:
      - Dockerfile.workload-image-transform
      - workloads/image-transform/**
      - .github/workflows/publish-workload.yml

permissions:
  contents: read
  packages: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Log in to GHCR
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username "${{ github.actor }}" --password-stdin
      - name: Build and publish immutable workload
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/powermesh-image-transform
        run: |
          docker build --file Dockerfile.workload-image-transform --tag "$IMAGE:demo" .
          docker push "$IMAGE:demo"
          docker pull "$IMAGE:demo"
          docker inspect --format='WORKLOAD_IMAGE={{index .RepoDigests 0}}' "$IMAGE:demo"
